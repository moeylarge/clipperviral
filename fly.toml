# fly.toml app configuration file generated for clipperviral-downloader on 2026-05-21T00:06:20-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'clipperviral-downloader'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  FFMPEG_PATH = '/usr/bin/ffmpeg'
  HOST = '0.0.0.0'
  PORT = '8787'
  YTDLP_BIN = '/usr/local/bin/yt-dlp'

[processes]
  app = 'node scripts/ytdlp-proxy.mjs'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'
    protocol = 'http'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
